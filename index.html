<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Bay Menu</title>
<meta name="description" content="Coffee Bay at Agora Mall, New Cairo. More than coffee, it's a good time.">
<meta name="theme-color" content="#150958">
<link rel="icon" href="assets/brand/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..900;1,8..60,400..700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Coffee Bay menu. Brand book: Sitka (serif) + Myriad (sans) -> Source Serif 4 + Source Sans 3; deep navy, white, silver.
   Pages: home (slogan over giant moving wordmark + three menu doors) -> menu (category tiles) -> category
   (one product with flavour buttons, photo stays while the background changes; or a simple list). */
:root{
  --navy:#150958; --navy-2:#23177a; --navy-3:#352a8c;
  --white:#ffffff; --paper:#f6f5fb; --mist:#ecebf5; --silver:#c0c0c0; --line:#dcdaea; --muted:#5d5880;
  --serif:"Source Serif 4","Sitka Text",Georgia,serif;
  --sans:"Source Sans 3","Myriad Pro","Helvetica Neue",Arial,sans-serif;
  --arabic:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --stage:var(--mist);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--navy);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="ar"] body{font-family:var(--arabic)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
i{font-style:italic;font-weight:400}
html[lang="ar"] i{font-style:normal}
.ar{display:none} html[lang="ar"] .ar{display:revert} html[lang="ar"] .en{display:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:var(--arabic)}

/* ---------- loader: bean, loading line, crack, torn reveal (entrance.mp4) ---------- */
.loader{position:fixed;inset:0;z-index:100;pointer-events:none;animation:hideL 0s linear 2.95s forwards}
.loader .half{position:absolute;top:0;bottom:0;width:52%;background:radial-gradient(60vw 60vh at 50vw 45vh,#2a1d8c 0%,#150958 60%,#0b0437 100%) 0 0/100vw 100vh no-repeat}
.half.l{left:0;clip-path:polygon(0 0,100% 0,96% 7%,100% 13%,96% 21%,99% 29%,95% 37%,100% 46%,96% 54%,99% 62%,95% 71%,100% 80%,96% 89%,99% 100%,0 100%);animation:tearL .85s cubic-bezier(.75,0,.2,1) 2s forwards}
.half.r{right:0;background-position:right 0 top 0;clip-path:polygon(4% 0,100% 0,100% 100%,1% 100%,4% 89%,0 80%,4% 71%,1% 62%,4% 54%,0 46%,5% 37%,1% 29%,4% 21%,0 13%,4% 7%);animation:tearR .85s cubic-bezier(.75,0,.2,1) 2s forwards}
.lc{position:absolute;inset:0;display:grid;place-items:center;animation:fadeL .35s ease 2.05s forwards}
.lc .wm{position:absolute;top:max(28px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:150px;opacity:.95}
.beans{position:relative;width:clamp(70px,9vw,104px);aspect-ratio:100/130;animation:beanIn .8s cubic-bezier(.2,.8,.2,1) both}
.beans .bean{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.beans .bl{animation:beanL .8s cubic-bezier(.75,0,.2,1) 1.95s forwards}
.beans .br{animation:beanR .8s cubic-bezier(.75,0,.2,1) 1.95s forwards}
.lline{position:absolute;top:calc(50% + clamp(56px,7vw,80px));left:50%;width:120px;height:2px;margin-left:-60px;background:rgba(255,255,255,.18);overflow:hidden}
.lline::after{content:"";position:absolute;inset:0;background:var(--silver);transform-origin:left;animation:fill 1.25s cubic-bezier(.6,0,.3,1) .2s both}
.lnote{position:absolute;bottom:max(28px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-family:var(--serif);font-style:italic;font-size:15px}
.crack{position:absolute;left:50%;top:0;height:100%;width:40px;margin-left:-20px;z-index:2;-webkit-mask-image:linear-gradient(#000 0 38%,transparent 42% 58%,#000 62%);mask-image:linear-gradient(#000 0 38%,transparent 42% 58%,#000 62%);animation:hideL 0s 2s forwards}
.crack path{stroke:#fff;stroke-width:2.5;fill:none;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw .5s cubic-bezier(.7,0,.3,1) 1.45s forwards;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
@keyframes beanIn{from{opacity:0;transform:scale(.6) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes tearL{to{transform:translateX(-104%) rotate(-3deg)}}
@keyframes tearR{to{transform:translateX(104%) rotate(3deg)}}
.beans .seam{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;filter:drop-shadow(0 0 4px #fff);animation:draw .45s cubic-bezier(.7,0,.3,1) 1.45s forwards,fadeL .2s ease 1.95s forwards}
.beans .bl,.beans .br{overflow:visible}
@keyframes beanL{to{transform:translateX(-28vw) rotate(-40deg) scale(1.5)}}
@keyframes beanR{to{transform:translateX(28vw) rotate(40deg) scale(1.5)}}
@keyframes fadeL{to{opacity:0}}
@keyframes hideL{to{visibility:hidden}}
html.seen .loader{display:none}

/* ---------- ticker + header ---------- */
.ticker{background:var(--navy);color:var(--white);overflow:hidden;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding-top:env(safe-area-inset-top,0px)}
.ticker div{display:flex;width:max-content;animation:slide 40s linear infinite;padding-block:8px}
.ticker span{padding-right:28px;white-space:nowrap}
html[dir="rtl"] .ticker div{animation-name:slideR}
@keyframes slide{to{transform:translateX(-50%)}} @keyframes slideR{to{transform:translateX(50%)}}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:12px}
.hnav{display:flex;gap:6px;align-items:center;min-width:0}
.hnav.r{justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--navy);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;letter-spacing:.04em;white-space:nowrap;transition:background .2s,color .2s}
.pill:hover,.pill.fill{background:var(--navy);color:var(--white)}
.pill svg{width:16px;height:16px;flex:none}
html[dir="rtl"] .pill.back svg{transform:scaleX(-1)}
.icon{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center;flex:none}
.icon svg{width:18px;height:18px}
.icon:hover{background:var(--navy);color:var(--white)}
.logo{display:block;width:clamp(116px,14vw,170px)}
.back[hidden]{display:none}
@media (max-width:600px){.hide-s{display:none}#backLabel{display:none}.pill.back{padding:9px}}

/* ---------- view transitions ---------- */
#view{min-height:60vh}
.enter{animation:enter .55s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;background:var(--white);padding-block:clamp(18px,3vw,36px) clamp(28px,4vw,48px)}
.giant{font-family:var(--serif);font-weight:900;color:var(--navy);font-size:clamp(84px,17vw,250px);line-height:.82;letter-spacing:-.035em;white-space:nowrap;user-select:none}
.giant .row{display:flex;width:max-content;animation:slide 26s linear infinite}
.giant .row.rev{animation-direction:reverse;animation-duration:30s}
.giant .row span{padding-right:.18em}
.giant .row.ghost{color:transparent;-webkit-text-stroke:2px var(--navy)}
.hstage{position:relative}
.hero-cup{position:absolute;left:50%;top:50%;width:clamp(210px,26vw,360px);aspect-ratio:3/4;transform:translate(-50%,-50%) rotate(-4deg);border-radius:200px 200px 28px 28px;overflow:hidden;box-shadow:0 40px 70px -30px rgba(21,9,88,.6);animation:bob 5s ease-in-out infinite;z-index:2;border:6px solid var(--white)}
.hero-cup img{width:100%;height:100%;object-fit:cover}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-50%,-54%) rotate(-2deg)}}
.slogan{position:relative;z-index:3;text-align:center;display:grid;gap:12px;justify-items:center;margin-top:clamp(18px,3vw,30px)}
.slogan h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.4vw,44px);line-height:1.1;text-wrap:balance}
.slogan h1 i{font-weight:400}
.slogan p{margin:0;color:var(--muted);font-size:15px}
.badge{position:absolute;z-index:3;right:clamp(16px,6vw,90px);top:clamp(20px,4vw,40px);width:clamp(92px,10vw,132px);aspect-ratio:1}
html[dir="rtl"] .badge{right:auto;left:clamp(16px,6vw,90px)}
.badge svg,.ring svg{width:100%;height:100%;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:700px){.badge{display:none}.giant{font-size:31vw;line-height:.86}.hero-cup{width:46vw;transform:translate(-50%,-50%) rotate(-4deg);animation-name:bobS}.slogan{margin-top:22px}}
@keyframes bobS{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-50%,-54%) rotate(-2deg)}}

.doors-head{display:grid;justify-items:center;gap:14px;text-align:center;padding-top:clamp(40px,6vw,72px);scroll-margin-top:80px}
.tags{display:flex;flex-wrap:wrap;justify-content:center}
.tag{border:1.5px solid var(--navy);border-radius:999px;padding:6px 18px;font-weight:700;font-size:13px;background:var(--white);margin:0 -3px}
.tag:nth-child(odd){transform:rotate(-4deg)} .tag:nth-child(even){transform:rotate(3deg);background:var(--navy);color:var(--white)}
h2.big{margin:0;font-family:var(--serif);font-weight:800;font-size:clamp(38px,5.6vw,72px);line-height:1;letter-spacing:-.02em;text-wrap:balance}
h2.big i{font-weight:400}
.doors{display:grid;gap:16px;padding-block:clamp(28px,4vw,44px) clamp(48px,7vw,90px)}
.door{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:clamp(16px,3vw,40px);border-radius:32px;padding:clamp(22px,3.4vw,44px);background:var(--paper);overflow:hidden;transition:transform .3s,box-shadow .3s}
.door:nth-child(2){background:var(--navy);color:var(--white)}
.door:hover{transform:translateY(-4px);box-shadow:0 30px 60px -36px rgba(21,9,88,.7)}
.door .num{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.door h3{margin:8px 0 10px;font-family:var(--serif);font-weight:800;font-size:clamp(44px,7vw,96px);line-height:.92;letter-spacing:-.025em}
.door h3 i{font-weight:400}
.door p{margin:0 0 18px;max-width:40ch;opacity:.8}
.go{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;border-bottom:2px solid currentColor;padding-bottom:3px}
.go svg{width:18px;height:18px;transition:transform .3s}
.door:hover .go svg{transform:translateX(6px)}
html[dir="rtl"] .go svg{transform:scaleX(-1)}
.door .pics{position:relative;height:clamp(200px,24vw,300px)}
.door .pics img{position:absolute;width:52%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:5px solid var(--white);box-shadow:0 20px 40px -24px rgba(0,0,0,.5);transition:transform .5s}
.door .pics img:nth-child(1){left:0;top:12%;transform:rotate(-6deg)}
.door .pics img:nth-child(2){left:26%;top:-4%;z-index:1;width:56%}
.door .pics img:nth-child(3){right:0;top:30%;transform:rotate(6deg)}
.door:hover .pics img:nth-child(1){transform:rotate(-10deg) translateX(-6px)}
.door:hover .pics img:nth-child(3){transform:rotate(10deg) translateX(6px)}
@media (max-width:760px){.door{grid-template-columns:minmax(0,1fr)}.door .pics{height:46vw;order:-1}}

.band{background:var(--navy);color:var(--white);overflow:hidden;position:relative}
.band .pattern{position:absolute;inset:0;opacity:.08;background:url(assets/brand/c-white.png) 0 0/90px auto repeat}
.band .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;padding-block:clamp(52px,7vw,96px)}
.band h2{margin:0;font-family:var(--serif);font-weight:800;font-size:clamp(40px,6vw,84px);line-height:.95;letter-spacing:-.02em}
.band h2 i{font-weight:400}
.info{display:grid;border-top:1px solid rgba(255,255,255,.35)}
.info div{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.2)}
.info b{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver);padding-top:3px}
.info a{border-bottom:1px solid rgba(255,255,255,.4)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.band .pill{border-color:var(--white)} .band .pill:hover,.band .pill.fill{background:var(--white);color:var(--navy)}
@media (max-width:800px){.band .wrap{grid-template-columns:minmax(0,1fr)}}
footer{background:var(--navy);color:var(--white);border-top:1px solid rgba(255,255,255,.15)}
footer .wrap{padding-block:26px calc(30px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
footer img{width:100%}
footer p{margin:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver)}

/* ---------- home v3: HEIST hero + happy-place collage ---------- */
.h3{position:relative;overflow:hidden;color:var(--white);background:radial-gradient(90% 70% at 50% 58%,#3a2ca6 0%,#20137a 38%,#150958 62%,#0b0437 100%);min-height:min(calc(100svh - 96px),900px);display:grid}
.h3 .wrap{position:relative;display:grid;grid-template-rows:auto 1fr auto;min-height:inherit;padding-block:clamp(22px,3vw,40px) clamp(22px,3vw,36px)}
.h3-top{text-align:center;font-family:var(--serif);font-weight:400;font-size:clamp(38px,6.4vw,96px);line-height:1;letter-spacing:-.02em;margin:0;position:relative;z-index:3;animation:rise .9s cubic-bezier(.2,.7,.2,1) var(--d0,.2s) both}
.h3-mid{position:relative;display:grid;place-items:start center;min-height:clamp(380px,44vw,600px)}
.h3-wm{width:min(94%,1160px);margin-top:clamp(10px,2vw,30px);position:relative;z-index:1;animation:rise 1s cubic-bezier(.2,.7,.2,1) var(--d1,.35s) both}
.h3-hand{position:absolute;left:50%;bottom:calc(-1 * clamp(22px,3vw,36px));height:min(86%,520px);max-width:none;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));animation:handUp 1.2s cubic-bezier(.2,.8,.2,1) var(--d2,.5s) both}
@keyframes handUp{from{opacity:0;transform:translate(-50%,40%) rotate(6deg)}to{opacity:1;transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.h3-side{position:absolute;z-index:3;font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,74px);line-height:1;letter-spacing:-.02em;bottom:14%;animation:rise .9s cubic-bezier(.2,.7,.2,1) var(--d3,.8s) both}
.h3-side.l{left:0} .h3-side.r{right:0}
html[dir="rtl"] .h3-side.l{left:auto;right:0} html[dir="rtl"] .h3-side.r{right:auto;left:0}
.h3-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;position:relative;z-index:3}
.h3-foot .badge2{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.h3-foot .badge2 .ringw{position:relative;width:76px;height:76px;flex:none}
.h3-foot .badge2 .ringw svg{width:100%;height:100%;animation:spin 20s linear infinite}
.h3-foot .badge2 .ringw img{position:absolute;inset:32%;width:36%}
.h3-cta{display:grid;gap:12px;max-width:290px;justify-items:start;font-size:15px;line-height:1.4}
.h3-cta p{margin:0;opacity:.85}
.btn-cream{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--white);color:var(--navy);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;padding:13px 18px;border-radius:4px}
.btn-cream svg{width:16px;height:16px}
.btn-cream:hover{background:var(--silver)}
.fly{position:absolute;z-index:2;filter:drop-shadow(0 24px 30px rgba(0,0,0,.4));animation:flyIn 1.1s cubic-bezier(.2,.8,.2,1) var(--fd,1s) both,float 6s ease-in-out calc(var(--fd,1s) + 1.1s) infinite}
.fly.a{width:clamp(64px,6.5vw,104px);left:2%;top:-22%;--r:-14deg;--fx:-60vw}
.fly.b{width:clamp(64px,6.5vw,104px);right:2%;top:-24%;--r:12deg;--fx:60vw;--fd:1.15s}
.fly.c{width:clamp(60px,6.5vw,104px);left:17%;bottom:30%;--r:10deg;--fx:-60vw;--fd:1.3s}
.fly.d{width:clamp(60px,6.5vw,104px);right:17%;bottom:33%;--r:-10deg;--fx:60vw;--fd:1.45s}
@keyframes flyIn{from{opacity:0;transform:translateX(var(--fx)) rotate(calc(var(--r) * 4))}to{opacity:1;transform:rotate(var(--r))}}
@keyframes float{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(var(--r)) translateY(-14px)}}
@media (max-width:760px){
  .h3{min-height:0}
  .h3 .wrap{grid-template-rows:auto auto auto;gap:6px}
  .h3-mid{min-height:112vw}
  .h3-wm{width:100%;margin-top:10px}
  .h3-hand{height:84vw;bottom:-22px}
  .h3-side{font-size:clamp(30px,9vw,44px);bottom:auto;top:26%}
  .h3-side.l{left:0} .h3-side.r{right:0;top:26%}
  .fly.a{top:auto;bottom:26%;left:0;width:18vw} .fly.b{top:auto;bottom:34%;right:0;width:18vw}
  .h3-foot{flex-direction:column-reverse;align-items:stretch}
  .h3-cta{max-width:none}
}
.happy{background:#f3eee6;position:relative;overflow:hidden}
.happy .wrap{position:relative;min-height:clamp(560px,62vw,820px);display:grid;place-items:center;padding-block:clamp(56px,8vw,110px)}
.happy h2{margin:0;position:relative;z-index:2;font-family:var(--sans);font-weight:700;text-transform:uppercase;color:var(--navy);font-size:clamp(46px,8.4vw,124px);line-height:.9;letter-spacing:-.035em;text-align:left}
html[lang="ar"] .happy h2{font-family:var(--arabic);text-align:right;letter-spacing:0;line-height:1.15}
.happy h2 span{display:block}
.happy .ph{position:absolute;overflow:hidden;box-shadow:0 20px 40px -24px rgba(21,9,88,.5)}
.happy .ph img{width:100%;height:100%;object-fit:cover}
.happy .p1{width:clamp(110px,15vw,210px);aspect-ratio:3/4;left:6%;top:28%;transform:rotate(-3deg)}
.happy .p2{width:clamp(130px,17vw,240px);aspect-ratio:4/3;right:12%;top:9%;transform:rotate(2deg)}
.happy .p3{width:clamp(120px,15vw,210px);aspect-ratio:1;right:9%;bottom:10%;transform:rotate(-2deg)}
.doodle{position:absolute;color:var(--navy);z-index:3;animation:wob 4s ease-in-out infinite}
.doodle svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.happy .d1{width:clamp(70px,9vw,120px);left:12%;bottom:14%}
.happy .d2{width:clamp(70px,9vw,120px);right:5%;top:40%;animation-delay:-1.5s}
.happy .d3{width:clamp(56px,6vw,90px);left:30%;top:9%;animation-delay:-2.6s}
@keyframes wob{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
@media (max-width:760px){.happy .wrap{min-height:0;padding-block:150px 160px}.happy .p1{top:20px;left:var(--gl);width:30vw}.happy .p2{top:30px;right:var(--gr);width:38vw}.happy .p3{bottom:24px;right:var(--gr);width:32vw}.happy .d1{bottom:30px;left:12%}.happy .d2{display:none}.happy .d3{top:auto;bottom:70px;left:44%}}
/* hero v8: live background like the ref video (beans drifting on top, coffee pouring + foam swirling below) */

.belt{margin-top:clamp(30px,5vw,60px);display:grid;gap:10px}
.track{display:flex;width:max-content;gap:clamp(18px,3vw,44px);animation:slide 38s linear infinite}
.track.rev{animation:slideR 44s linear infinite;transform:translateX(-50%)}
.belt:hover .track{animation-play-state:paused}
.bcup{display:grid;justify-items:center;gap:6px;color:#fff;text-align:center;flex:none}

.door .cuts{position:relative;height:clamp(220px,26vw,320px)}

.tile{position:relative;display:grid;align-content:start;border-radius:26px;overflow:hidden;background:var(--tbg,var(--paper));transition:transform .3s,box-shadow .3s}

  document.getElementById('hcDots').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b) return; hcGo(+b.dataset.i); clearInterval(hcTimer); tick();});
  if(matchMedia('(hover:hover)').matches) c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect(); c.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5).toFixed(3)); c.style.setProperty('--my',((e.clientY-r.top)/r.height-.5).toFixed(3));});
}
var hxI=0, hxTimer=null;
function hxFit(){ var n=document.getElementById('hxNames'); if(!n) return; var W=n.clientWidth;
  n.querySelectorAll('.hx-row').forEach(function(r){ var sp=r.firstChild; r.style.fontSize='100px'; var w=sp.scrollWidth||1; var f=Math.min(100*W/w*.98, innerWidth<760?innerWidth*.3:260); r.style.fontSize=f.toFixed(1)+'px'; }); }
function hxGo(i){ var HX=window._HX, n=document.getElementById('hxNames'); if(!n||!HX) return; i=(i+HX.length)%HX.length; if(i===hxI) return;
  var x=HX[i], name=ar()?x.ar:x.n, imgs=document.querySelectorAll('#hxCups img'), old=hxI; hxI=i;
  imgs[old].classList.remove('on'); imgs[old].classList.add('leave'); setTimeout(function(){imgs[old].classList.remove('leave')},700);
  imgs[i].classList.add('on');
  n.classList.add('out');
  setTimeout(function(){ n.querySelectorAll('.hx-row span').forEach(function(s){s.textContent=name}); n.classList.remove('out'); n.classList.add('pre'); hxFit(); void n.offsetWidth; n.classList.remove('pre'); },450);
  var st=document.getElementById('hxSticker'); st.href='#'+x.cat; st.querySelector('b').textContent=x.p; st.classList.remove('bump'); void st.offsetWidth; st.classList.add('bump');
  document.querySelector('#hxNow span').textContent=name;
  document.querySelectorAll('#hxDots button').forEach(function(b,k){b.classList.toggle('on',k===i)});
  if(imgs[(i+1)%HX.length]) imgs[(i+1)%HX.length].loading='eager';
}
function hxStart(){ clearInterval(hxTimer); hxI=0; var stg=document.getElementById('hxStage'); if(!stg) return; hxFit();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(hxFit);
  var first=root.classList.contains('seen')?1200:3600;
  setTimeout(function(){ if(document.getElementById('hxStage')!==stg) return; hxTimer=setInterval(function(){ if(!document.hidden) hxGo(hxI+1) },3200); }, first);
  document.getElementById('hxDots').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b) return; hxGo(+b.dataset.i); clearInterval(hxTimer); hxTimer=setInterval(function(){hxGo(hxI+1)},3200);});
  if(matchMedia('(hover:hover)').matches) stg.addEventListener('pointermove',function(e){var r=stg.getBoundingClientRect(); stg.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5).toFixed(3)); stg.style.setProperty('--my',((e.clientY-r.top)/r.height-.5).toFixed(3));});
}
window.addEventListener('resize',hxFit);
var storyIdx=-1;
function storyTick(){
  var st=document.getElementById('story'); if(st){
    var r=st.getBoundingClientRect(), H=innerHeight, p=Math.min(1,Math.max(0,-r.top/(r.height-H))), n=window._SC.length, seg=p*(n-1+.4)-.2, idx=0;
    var sc=st.querySelectorAll('.scene');
    sc.forEach(function(el,i){ var t=i?Math.min(1,Math.max(0,(seg-(i-1)-.25)/.5)):1; if(i){el.style.clipPath='inset('+((1-t)*100).toFixed(2)+'% 0 0 0)'; if(t>.5) idx=i;}
      var loc=Math.min(1,Math.max(0,seg-i+1)); el.style.setProperty('--z',(1.28-.2*loc).toFixed(3)); el.querySelector('.word').style.setProperty('--wy',((seg-i)*-90).toFixed(1)+'px'); });
    st.querySelector('.cup').style.setProperty('--rot',(Math.sin(seg*Math.PI)*7).toFixed(2)+'deg');
    if(idx!==storyIdx){ storyIdx=idx; var x=window._SC[idx];
      st.querySelectorAll('.cup img').forEach(function(im,i){im.classList.toggle('on',i===idx)});
      st.querySelectorAll('.dots i').forEach(function(d,i){d.classList.toggle('on',i===idx)});
      var a=document.getElementById('storyNow'); a.href='#'+x.cat; a.firstChild.nodeValue=x.n+' '; }
  }
  var hc=document.getElementById('hc'); if(hc){ var hr=hc.getBoundingClientRect(); hc.style.setProperty('--sp',Math.min(1,Math.max(0,-hr.top/hr.height)).toFixed(3)); }
  var g=document.getElementById('goon'); if(g){ var gr=g.getBoundingClientRect(), gp=Math.min(1,Math.max(0,(innerHeight-gr.top)/gr.height)); g.style.setProperty('--gp',gp.toFixed(3));
    if(gp>=.97&&scrollY>120&&!g.dataset.go){ g.dataset.go='1'; g.classList.add('go'); setTimeout(function(){ if(document.getElementById('goon')===g){ var r2=g.getBoundingClientRect(); if(r2.bottom<=innerHeight+40) location.hash=g.getAttribute('href'); else { delete g.dataset.go; g.classList.remove('go'); } } },450); } }
  var pc=document.getElementById('pcard'); if(pc&&!pc.classList.contains('in')&&pc.getBoundingClientRect().top<innerHeight*.85) pc.classList.add('in');
}
var tq=false; window.addEventListener('scroll',function(){ if(!tq){tq=true;requestAnimationFrame(function(){tq=false;storyTick()})} },{passive:true});
window.addEventListener('resize',storyTick);
(function(){var m=/[?&]at=([\w.]+)/.exec(location.search); if(!m) return; setTimeout(function(){var st=document.getElementById('story'); var gg=document.getElementById('goon'); var y=m[1]==='end'&&gg?scrollY+gg.getBoundingClientRect().bottom-innerHeight+2:!st?0:m[1]==='parade'?document.querySelector('.parade').offsetTop-40:st.offsetTop+(st.offsetHeight-innerHeight)*parseFloat(m[1]); scrollTo(0,y); storyTick();},2500)})();


var sheet=$('#sheet'), search=$('#search');
function openRow(c,pi){ var o=c.products[pi].opts[0]; $('#sImg').src=o.big||o.img||'assets/brand/packaging.jpg'; $('#sImg').alt=o.n; $('#sBody').innerHTML=detailHTML(o); sheet.showModal(); sheet.querySelector('.sin').scrollTop=0; }
document.addEventListener('click',function(e){
  var mn=e.target.closest('a[href="#menus"]'); if(mn){ e.preventDefault(); var go=function(){var t=$('#menus'); if(t) t.scrollIntoView({behavior:'smooth'});}; if(MENU[curHash()]||CAT[curHash()]){ history.pushState(null,'',location.pathname+location.search); route(); setTimeout(go,60);} else go(); return; }
  var t=e.target.closest('.opt'); if(t){ var c=CAT[decodeURIComponent(location.hash.slice(1))]; if(c) choose(c,Number(t.dataset.o)); return; }
  t=e.target.closest('.row[data-cat]'); if(t){ openRow(CAT[t.dataset.cat],Number(t.dataset.p)); return; }
  t=e.target.closest('[data-close]'); if(t){ t.closest('dialog').close(); return; }
  if(e.target===sheet) sheet.close(); if(e.target===search) search.close();
});
$('#openSearch').addEventListener('click',function(){ search.showModal(); $('#q').value=''; runSearch(); $('#q').focus(); });
var INDEX=[]; D.cats.forEach(function(c){c.products.forEach(function(p,pi){p.opts.forEach(function(o,oi){INDEX.push({c:c,pi:pi,oi:oi,o:o,s:(o.n+' '+o.la+' '+o.d+' '+c.en+' '+c.ar).toLowerCase()})})})});
function runSearch(){
  var v=$('#q').value.toLowerCase().trim(), box=$('#sres');
  if(!v){ box.innerHTML='<div class="none">'+T('Type a drink or dessert','اكتب اسم مشروب أو حلو')+'</div>'; return; }
  var hits=INDEX.filter(function(x){return x.s.indexOf(v)>-1}).slice(0,40);
  box.innerHTML=hits.length?hits.map(function(x){return '<a href="#'+x.c.slug+'" data-pick="'+x.oi+'" data-pi="'+x.pi+'">'+img(x.o.img,'')+'<span><b>'+esc(T(x.o.n,x.o.la))+'</b><small>'+esc(T(x.c.en,x.c.ar))+'</small></span><span class="price" style="font-size:16px">'+priceOf(x.o)+'</span></a>'}).join(''):'<div class="none">'+T('Nothing found. Try latte, boba or waffle.','لا توجد نتائج. جرّب لاتيه أو بوبا أو وافل.')+'</div>';
}
$('#q').addEventListener('input',runSearch);
$('#sres').addEventListener('click',function(e){ var a=e.target.closest('a'); if(!a) return; e.preventDefault(); search.close();
  var slug=a.getAttribute('href').slice(1), pi=Number(a.dataset.pi), oi=Number(a.dataset.pick), c=CAT[slug];
  if(location.hash!=='#'+slug){ history.pushState(null,'','#'+slug); } route();
  if(c.products[pi].name) choose(c,oi); else openRow(c,pi);
});

$('#lang').addEventListener('click',function(){ var l=ar()?'en':'ar'; root.lang=l; root.dir=l==='ar'?'rtl':'ltr'; try{localStorage.setItem('cb-lang',l)}catch(e){} drawStatic(); route(); });

drawStatic(); route();
})();
</script>
